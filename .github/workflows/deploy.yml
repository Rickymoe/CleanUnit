name: Publiser til Pages (uten kommentarer)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test og bygg sidene fra malen
        run: |
          node --test test/*.test.js
          node bygg.js

      - name: Fjern kommentarer fra HTML/CSS/JS
        run: |
          for f in dist/index.html dist/stavanger/index.html; do
            npx --yes html-minifier-terser --remove-comments \
              --minify-js '{"compress":false,"mangle":false}' \
              "$f" -o "$f"
          done
          npx --yes clean-css-cli -O1 --format keep-breaks \
            -o dist/css/style.css dist/css/style.css
          npx --yes terser dist/js/main.js -f beautify \
            -o dist/js/main.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
