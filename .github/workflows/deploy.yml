name: Publiser til Pages (uten kommentarer)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Installer byggeverktøy (låst i package-lock.json)
        run: npm ci

      - name: Test og bygg sidene fra malen
        run: |
          node --test test/*.test.js
          node bygg.js

      - name: Fjern kommentarer fra HTML/CSS/JS
        run: |
          test "$(find dist -name '*.html' | wc -l)" -eq 10
          for f in $(find dist -name '*.html' | sort); do
            npx --no-install html-minifier-terser --remove-comments \
              --minify-js '{"compress":false,"mangle":false}' \
              "$f" -o "$f"
          done
          npx --no-install cleancss -O1 --format keep-breaks \
            -o dist/css/style.css dist/css/style.css
          npx --no-install terser dist/js/main.js -f beautify \
            -o dist/js/main.js

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
