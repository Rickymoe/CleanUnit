<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
document.documentElement.classList.add("js");
// Vinterscene i heroen 1. desember til 6. januar. ?vinter og ?sommer i adressen tvinger en av dem
// (for å vise fram eller teste utenom sesongen). Settes her, før noe tegnes, så det ikke blinker.
(function () {
  var d = new Date(), q = location.search;
  if (/[?&]vinter\b/.test(q) || (!/[?&]sommer\b/.test(q) && (d.getMonth() === 11 || (d.getMonth() === 0 && d.getDate() <= 6)))) {
    document.documentElement.classList.add("vinter");
  }
})();
// Boblene i toppmenyens logo animeres bare første gang siden åpnes i en økt, ved oppdatering (refresh) og når man har trykket
// på logoen for å komme til forsiden (cuLogoKlikk, satt i js/main.js): ikke når man ellers går mellom sidene på nettstedet (da ville den stå og blinke på hver side). Settes her, før noe tegnes. Uten lagring
// (privat vindu) animeres de bare ved oppdatering og ved første åpning.
(function () {
  try {
    var nav = performance.getEntriesByType("navigation")[0], type = nav ? nav.type : "navigate";
    var sett = false;
    try { sett = !!sessionStorage.getItem("cuLogoAnim"); sessionStorage.setItem("cuLogoAnim", "1"); } catch (e) {}
    var klikk = false;
    try { klikk = !!sessionStorage.getItem("cuLogoKlikk"); sessionStorage.removeItem("cuLogoKlikk"); } catch (e) {}
    if (type === "reload" || klikk || (type === "navigate" && !sett)) document.documentElement.classList.add("logo-anim");
  } catch (e) {}
})();
// Nødluke: hvis js/main.js 404-er eller kaster før logoAnimer() kjører,
// blir ordmerket (html.js .logo, klippet av clip-path) usynlig for alltid.
// Etter 1,2 s uten .kjor: vis logoen. Sjekker selve .kjor-klassen (ikke bare
// at main.js kjørte) — en gammel cachet main.js kan kjøre uten å kjenne ny
// markup. Seksjonsoverskriftene trenger ingen nødluke: html.js-vask settes
// først av main.js, så uten den er de alltid synlige.
addEventListener("load", function () {
  setTimeout(function () {
    var logo = document.querySelector(".hero .logo");
    if (logo && !logo.classList.contains("kjor")) logo.classList.add("kjor");
  }, 1200);
});
</script>
<script nomodule>document.documentElement.classList.remove("js")</script>

<!-- Toppmeny (Ricky 2026-10-02: «vi trenger en header med lenke nedover på siden»), i Maritts
     rekkefølge: Tjenester · Referanser · Om oss · Miljø · Kontakt (Marit 2026-10-05: kortere
     topptekst, «Kontakt» som menyvalg, ingen knapp), med den andre byen til høyre. Fire av
     menyvalgene er egne sider (aria-current="page" på gjeldende); Kontakt er #kontakt nederst på
     hver side. Ingen scrollspy. Uten JS vises lenkene alltid (html.js styrer mobilmenyen). -->

  <div class="wrap side-nav__rad">
    <a class="side-nav__logo" href="{{logo_href}}" aria-label="{{logo_label}}"><svg viewBox="501.55 -34.9 104 104" width="104" height="104" aria-hidden="true" focusable="false"><circle cx="569.0" cy="-7.5" r="25.7" fill="#87CAC9"/><circle cx="530.2" cy="27.8" r="17.8" fill="#008789"/><circle cx="551.2" cy="58.4" r="9.0" fill="#AED1D1"/><defs><clipPath id="nb-klipp"><circle cx="569.0" cy="-7.5" r="25.7"/><circle cx="530.2" cy="27.8" r="17.8"/><circle cx="551.2" cy="58.4" r="9.0"/></clipPath><linearGradient id="nb-skinn" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#nb-klipp)"><rect class="nb-skinn" x="470" y="-45" width="44" height="130" fill="url(#nb-skinn)"/></g></svg></a>
    <a class="side-nav__kontakt knapp knapp--omriss" href="#kontakt">Kontakt</a>
    <button class="side-nav__bryter" type="button" aria-expanded="false" aria-controls="side-nav-meny"><span class="side-nav__bryter-ikon" aria-hidden="true"></span><span class="visually-hidden">Meny</span></button>
    <nav class="side-nav__meny" id="side-nav-meny" aria-label="Hovedmeny">
      <ul>
        <li><a class="side-nav__lenke" href="{{by_rot}}tjenester/"{{aktiv_tjenester}}>Tjenester</a></li>
        <li><a class="side-nav__lenke" href="{{by_rot}}referanser/"{{aktiv_referanser}}>Referanser</a></li>
        <li><a class="side-nav__lenke" href="{{by_rot}}om-oss/"{{aktiv_om_oss}}>Om oss</a></li>
        <li><a class="side-nav__lenke" href="{{by_rot}}miljo/"{{aktiv_miljo}}>Miljø</a></li>
        <li><a class="side-nav__lenke" href="#kontakt">Kontakt</a></li>
      </ul>
      <a class="side-nav__by" href="{{andre_by_hjem}}">{{andre_by_navn}} <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>

{{> side}}
{{> kontakt}}
</main>

         merket «P». Under 48rem vises tre ruter (bil, bil, P). -->

      <img loading="lazy" decoding="async" class="parkering__bil" src="{{rot}}bilder/varebil-hero.svg" alt="" width="347" height="154">
      <span class="parkering__p">P</span>

      <img loading="lazy" decoding="async" class="parkering__bil" src="{{rot}}bilder/varebil-hero.svg" alt="" width="347" height="154">
