<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
document.documentElement.classList.add("js");
// Vinterscene i heroen 1. desember til 6. januar. ?vinter og ?sommer i adressen tvinger en av dem
// (for å vise fram eller teste utenom sesongen). Settes her, før noe tegnes, så det ikke blinker.
(function () {
  var d = new Date(), q = location.search;
  if (/[?&]vinter\b/.test(q) || (!/[?&]sommer\b/.test(q) && (d.getMonth() === 11 || (d.getMonth() === 0 && d.getDate() <= 6)))) {
    document.documentElement.classList.add("vinter");
  }
})();
// Nødluke: hvis js/main.js 404-er eller kaster før logoAnimer() kjører,
// blir ordmerket (html.js .logo, klippet av clip-path) usynlig for alltid.
// Etter 1,2 s uten .kjor: vis logoen. Sjekker selve .kjor-klassen (ikke bare
// at main.js kjørte) — en gammel cachet main.js kan kjøre uten å kjenne ny
// markup. Seksjonsoverskriftene trenger ingen nødluke: html.js-vask settes
// først av main.js, så uten den er de alltid synlige.
addEventListener("load", function () {
  setTimeout(function () {
    var logo = document.querySelector(".hero .logo");
    if (logo && !logo.classList.contains("kjor")) logo.classList.add("kjor");
  }, 1200);
});
</script>
<script nomodule>document.documentElement.classList.remove("js")</script>

<!-- Toppmeny (Ricky 2026-10-02: «vi trenger en header med lenke nedover på siden»), i Maritts
     rekkefølge: Tjenester · Referanser · Om oss · Miljø · Kontakt (Marit 2026-10-05: kortere topptekst, «Kontakt» som menyvalg, ingen knapp), med den andre byen til

     vises lenkene alltid (html.js styrer mobilmenyen), og
     .side-nav__lenke[aria-current] settes av js/main.js ut fra hvor man er på siden. -->

    <button class="side-nav__bryter" type="button" aria-expanded="false" aria-controls="side-nav-meny"><span class="side-nav__bryter-ikon" aria-hidden="true"></span><span class="visually-hidden">Meny</span></button>
    <nav class="side-nav__meny" id="side-nav-meny" aria-label="Hovedmeny">
      <ul>
        <li><a class="side-nav__lenke" href="#tjenester">Tjenester</a></li>
        <li><a class="side-nav__lenke" href="#referanser">Referanser</a></li>
        <li><a class="side-nav__lenke" href="#om-oss">Om oss</a></li>
        <li><a class="side-nav__lenke" href="#hvorfor">Miljø</a></li>

  </div>
</header>
